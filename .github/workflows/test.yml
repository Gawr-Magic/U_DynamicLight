name: Test, build, and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/verify_dist.py
      - name: Record artifact checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-light-dist
          path: dist/*
          if-no-files-found: error

  test:
    name: Regression tests (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dynamic-light-dist
          path: dist
      - name: Verify and install the release wheel
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python scripts/verify_dist.py
          python -m pip install dist/*.whl
          python -m pip check
          python -m pip show endstone-u-dynamic-light mcbe-binarystream
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts

  release:
    name: Publish verified release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'ReallocAll/U_DynamicLight' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        github.event.before == 'a0c68a9464d7ccea36fd1a63dbdd7a49995ba985' &&
        github.event.head_commit.message == 'Release U-DynamicLight 260522.post1'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: dynamic-light-dist
          path: dist
      - name: Verify exact release target
        id: target
        env:
          RELEASE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          sha = os.environ['RELEASE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = f'v{version}'
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == tag, (os.environ['REF_NAME'], tag)
          else:
              assert os.environ['REF_NAME'] == 'master'
              assert version == '260522.post1', version
              parent = subprocess.check_output(['git', 'log', '-1', '--format=%P'], text=True).strip()
              assert parent == 'a0c68a9464d7ccea36fd1a63dbdd7a49995ba985', parent
              import json
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              assert event['before'] == 'a0c68a9464d7ccea36fd1a63dbdd7a49995ba985'
              assert event['after'] == sha
              assert event['head_commit']['message'] == 'Release U-DynamicLight 260522.post1'
          refs = subprocess.check_output(
              ['git', 'ls-remote', '--tags', 'origin', f'refs/tags/{tag}', f'refs/tags/{tag}^{{}}'], text=True)
          targets = {ref: commit for commit, ref in (line.split() for line in refs.splitlines())}
          if targets:
              target = targets.get(f'refs/tags/{tag}^{{}}', targets.get(f'refs/tags/{tag}'))
              assert target == sha, (tag, target, sha)
          notes = Path(f'docs/release-{version}.md')
          assert notes.is_file(), notes
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nnotes={notes}\n')
      - name: Verify downloaded release artifacts
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python scripts/verify_dist.py
      - name: Publish release and tested artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.target.outputs.notes }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
